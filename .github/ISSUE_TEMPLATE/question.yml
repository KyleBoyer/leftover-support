name: Ask a question or suggest a feature
description: Questions, ideas, and feedback about Leftover.
labels: [question]
body:
  - type: markdown
    attributes:
      value: |
        **Issues are public. Please don't include personal or financial details.**
  - type: textarea
    id: question
    attributes:
      label: Your question or idea
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device (optional)
      placeholder: iPhone 15, iOS 26.1
